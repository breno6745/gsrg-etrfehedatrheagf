<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vela — Pesquisa</title>
<meta name="description" content="Pesquise com calma.">
<meta name="theme-color" content="#0e0d17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%B5%3C/text%3E%3C/svg%3E">

<style>
  /* ==========================================================
     TOKENS DE DESIGN — edite aqui para mudar cores e tamanhos
     ========================================================== */
  :root {
    --bg:          #0e0d17;               /* fundo base (ameixa muito escura) */
    --surface:     rgba(255,255,255,.055);/* barra de pesquisa */
    --surface-hi:  rgba(255,255,255,.085);/* barra em hover/focus */
    --line:        rgba(255,255,255,.10); /* bordas */
    --line-hi:     rgba(170,182,255,.55); /* borda em focus */
    --text:        #ecebf5;
    --muted:       #8d8ba3;
    --accent:      #a9b4ff;               /* periwinkle */
    --accent-warm: #ffb995;               /* pêssego (brilho sutil) */
    --radius:      999px;
    --ease:        cubic-bezier(.22,.8,.24,1);
    --font: "Inter", "SF Pro Display", "Segoe UI Variable Display", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    display: grid;
    place-items: center;              /* centraliza vertical e horizontalmente */
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Brilhos de fundo (aurora suave, sem imagens externas) */
  .glow { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .glow::before, .glow::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .34;
  }
  .glow::before {
    width: 52vmax; height: 52vmax; left: -14vmax; top: -22vmax;
    background: radial-gradient(circle, #5a5cff 0%, transparent 65%);
    animation: drift 22s ease-in-out infinite alternate;
  }
  .glow::after {
    width: 40vmax; height: 40vmax; right: -12vmax; bottom: -20vmax;
    background: radial-gradient(circle, var(--accent-warm) 0%, transparent 65%);
    opacity: .16;
    animation: drift 28s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift { to { transform: translate3d(6vmax, 4vmax, 0) scale(1.08); } }

  /* ---------- Layout ---------- */
  main {
    position: relative; z-index: 1;
    width: 100%; max-width: 680px;
    display: flex; flex-direction: column; align-items: center;
    /* leve compensação para o conjunto parecer visualmente centrado */
    transform: translateY(-4vh);
  }

  /* Nome do site */
  .brand {
    margin: 0 0 clamp(26px, 5vh, 44px);
    font-size: clamp(3.4rem, 13vw, 6.4rem);
    font-weight: 600;
    letter-spacing: -.055em;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 15%, #a9a7c6 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    user-select: none;
  }

  /* ---------- Barra de pesquisa ---------- */
  .search {
    position: relative; width: 100%;
    display: flex; align-items: center;
    height: 64px; padding: 0 8px 0 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 18px 50px -18px rgba(0,0,0,.7);
    transition: background .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease), transform .3s var(--ease);
  }
  .search:hover { background: var(--surface-hi); border-color: rgba(255,255,255,.18); }
  .search:focus-within {
    background: var(--surface-hi);
    border-color: var(--line-hi);
    transform: translateY(-1px);
    box-shadow: 0 0 0 5px rgba(169,180,255,.10), 0 24px 60px -20px rgba(90,92,255,.45);
  }

  .search .icon-search { flex: none; width: 22px; height: 22px; color: var(--muted); transition: color .3s var(--ease); }
  .search:focus-within .icon-search { color: var(--accent); }

  .search input {
    flex: 1; min-width: 0; height: 100%;
    padding: 0 14px;
    background: transparent; border: 0; outline: 0;
    color: var(--text); font: inherit; font-size: 1.06rem; letter-spacing: -.01em;
  }
  .search input::placeholder { color: var(--muted); transition: opacity .25s; }
  .search input:focus::placeholder { opacity: .55; }

  /* Dica de atalho "/" */
  .kbd {
    flex: none; margin-right: 8px;
    font-size: .74rem; color: var(--muted);
    border: 1px solid var(--line); border-radius: 7px; padding: 2px 8px;
    transition: opacity .25s;
  }
  .search:focus-within .kbd, .search.has-value .kbd { opacity: 0; }

  /* Botão de envio (integrado ao campo) */
  .submit {
    flex: none; position: relative;
    width: 48px; height: 48px; border: 0; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    color: #12111d;
    background: linear-gradient(135deg, #c9d0ff, var(--accent));
    box-shadow: 0 6px 20px -6px rgba(140,152,255,.7);
    transition: transform .25s var(--ease), box-shadow .25s var(--ease), filter .25s;
  }
  .submit:hover  { transform: scale(1.06); box-shadow: 0 8px 26px -6px rgba(140,152,255,.9); }
  .submit:active { transform: scale(.96); }
  .submit:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .submit svg { width: 20px; height: 20px; transition: opacity .2s, transform .3s var(--ease); }
  .submit .spinner { position: absolute; opacity: 0; transform: scale(.6); animation: spin .8s linear infinite paused; }

  /* Estado de carregamento */
  .search.loading .submit { pointer-events: none; filter: saturate(.8); }
  .search.loading .submit .arrow   { opacity: 0; transform: translateX(6px); }
  .search.loading .submit .spinner { opacity: 1; transform: scale(1); animation-play-state: running; }
  .search.loading::after {           /* barra de progresso sutil na base */
    content: ""; position: absolute; left: 28px; right: 28px; bottom: -1px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 40% 100%; background-repeat: no-repeat;
    animation: sweep 1.1s var(--ease) infinite;
  }
  @keyframes spin  { to { rotate: 360deg; } }
  @keyframes sweep { from { background-position: -50% 0; } to { background-position: 150% 0; } }

  /* ---------- Atalhos / sugestões ---------- */
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; font: inherit; font-size: .86rem; color: var(--muted);
    background: transparent; border: 1px solid transparent; border-radius: var(--radius); cursor: pointer;
    transition: color .25s, background .25s, border-color .25s, transform .25s var(--ease);
  }
  .chip svg { width: 15px; height: 15px; }
  .chip:hover { color: var(--text); background: rgba(255,255,255,.05); transform: translateY(-1px); }
  .chip[aria-pressed="true"] { color: var(--text); background: rgba(169,180,255,.10); border-color: rgba(169,180,255,.28); }

  /* ---------- Mensagem de status / histórico ---------- */
  .status { min-height: 1.4em; margin-top: 22px; font-size: .9rem; color: var(--muted); text-align: center; transition: opacity .3s; }
  .history { list-style: none; margin: 14px 0 0; padding: 0; width: 100%; display: none; }
  .history.show { display: block; animation: rise .5s var(--ease) both; }
  .history button {
    width: 100%; text-align: left; padding: 10px 18px; font: inherit; font-size: .93rem; color: var(--muted);
    background: transparent; border: 0; border-radius: 14px; cursor: pointer; transition: color .2s, background .2s;
  }
  .history button:hover, .history button:focus-visible { color: var(--text); background: rgba(255,255,255,.05); outline: 0; }
  .history .vazio { padding: 10px 18px; color: var(--muted); font-size: .9rem; text-align: center; }

  /* ---------- Entrada dos elementos (sequência única ao carregar) ---------- */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .brand   { animation: rise .9s var(--ease) .05s both; }
  .search  { animation: rise .9s var(--ease) .20s both; }
  .chips   { animation: rise .9s var(--ease) .35s both; }

  /* ---------- Responsivo ---------- */
  @media (max-width: 520px) {
    .search { height: 58px; padding-left: 18px; }
    .submit { width: 44px; height: 44px; }
    .kbd { display: none; }
    .search input { font-size: 1rem; }
  }

  /* Respeita quem prefere menos movimento */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<body>
  <div class="glow" aria-hidden="true"></div>

  <main>
    <!-- NOME DO SITE: altere aqui e no <title> acima -->
    <h1 class="brand">Vela</h1>

    <form class="search" id="form" role="search" autocomplete="off">
      <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>

      <input id="q" name="q" type="text" placeholder="O que você quer descobrir hoje?"
             aria-label="Campo de pesquisa" enterkeyhint="search" spellcheck="false">
      <span class="kbd" aria-hidden="true">/</span>

      <button class="submit" type="submit" aria-label="Pesquisar">
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
        <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
          <path d="M12 3a9 9 0 1 0 9 9" />
        </svg>
      </button>
    </form>

    <!-- Atalhos discretos: alteram o "modo" da barra -->
    <div class="chips" role="group" aria-label="Modo de pesquisa">
      <button class="chip" type="button" data-mode="pesquisar" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        Pesquisar
      </button>
      <button class="chip" type="button" data-mode="endereco" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        Abrir endereço
      </button>
      <button class="chip" type="button" data-mode="historico" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
        Histórico
      </button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <ul class="history" id="history" aria-label="Pesquisas recentes"></ul>
  </main>

<script>
/* ============================================================
   CONFIGURAÇÕES — edite aqui
   ============================================================ */
const CONFIG = {
  historicoChave: "vela:historico", // chave usada no localStorage do navegador
  historicoMax: 8,                  // quantidade de itens guardados
  placeholders: {                   // texto da barra em cada modo
    pesquisar: "O que você quer descobrir hoje?",
    endereco:  "Cole ou digite um endereço, ex.: exemplo.com",
    historico: "Filtre suas pesquisas recentes…"
  }
};

/* ============================================================
   >>> FUNÇÃO DE PROCESSAMENTO DA PESQUISA <<<
   ------------------------------------------------------------
   Este é o ÚNICO ponto que você precisa editar para ligar a
   página a uma funcionalidade real.

   Parâmetros:
     consulta  → texto digitado pelo usuário (já sem espaços nas pontas)
     modo      → "pesquisar" | "endereco"

   Deve retornar (ou resolver) uma mensagem curta de texto para
   ser exibida abaixo da barra. Pode ser assíncrona (async/await),
   o estado de "loading" fica ativo até ela terminar.

   Exemplos do que você poderia fazer aqui:
     • Redirecionar:   window.location.href = "https://duckduckgo.com/?q=" + encodeURIComponent(consulta);
     • Abrir endereço: window.open(normalizarUrl(consulta), "_blank", "noopener");
     • Chamar sua API: const r = await fetch("/sua-api?q=" + encodeURIComponent(consulta));
   ============================================================ */
async function processarPesquisa(consulta, modo) {
  // --- SUBSTITUA O BLOCO ABAIXO PELA SUA LÓGICA ---
  await new Promise(resolve => setTimeout(resolve, 900)); // simula um processamento
  console.log("[Vela] processarPesquisa:", { consulta, modo });
  return "Nenhum mecanismo de busca conectado ainda. Edite a função processarPesquisa().";
  // --- FIM DO BLOCO A SUBSTITUIR ---
}

/* ============================================================
   CÓDIGO DA INTERFACE (normalmente não precisa editar)
   ============================================================ */
const form    = document.getElementById("form");
const input   = document.getElementById("q");
const statusEl = document.getElementById("status");
const listEl  = document.getElementById("history");
const chips   = document.querySelectorAll(".chip");
let modo = "pesquisar";
let ocupado = false;

/* ---- Histórico (localStorage, com proteção caso esteja bloqueado) ---- */
function lerHistorico() {
  try { return JSON.parse(localStorage.getItem(CONFIG.historicoChave)) || []; }
  catch { return []; }
}
function salvarHistorico(texto) {
  try {
    const lista = [texto, ...lerHistorico().filter(t => t !== texto)].slice(0, CONFIG.historicoMax);
    localStorage.setItem(CONFIG.historicoChave, JSON.stringify(lista));
  } catch { /* armazenamento indisponível: ignora */ }
}
function desenharHistorico() {
  const filtro = input.value.trim().toLowerCase();
  const itens = lerHistorico().filter(t => t.toLowerCase().includes(filtro));
  listEl.innerHTML = "";
  if (!itens.length) {
    const li = document.createElement("li");
    li.className = "vazio";
    li.textContent = filtro ? "Nada encontrado." : "Suas pesquisas aparecerão aqui.";
    listEl.appendChild(li);
    return;
  }
  itens.forEach(texto => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button"; b.textContent = texto;
    b.addEventListener("click", () => { definirModo("pesquisar"); input.value = texto; atualizarEstadoInput(); input.focus(); });
    li.appendChild(b); listEl.appendChild(li);
  });
}

/* ---- Modos (Pesquisar / Abrir endereço / Histórico) ---- */
function definirModo(novo) {
  modo = novo;
  chips.forEach(c => c.setAttribute("aria-pressed", String(c.dataset.mode === modo)));
  input.placeholder = CONFIG.placeholders[modo];
  statusEl.textContent = "";
  listEl.classList.toggle("show", modo === "historico");
  if (modo === "historico") desenharHistorico();
}
chips.forEach(c => c.addEventListener("click", () => {
  // clicar de novo no modo ativo (exceto "pesquisar") volta ao padrão
  definirModo(c.dataset.mode === modo && modo !== "pesquisar" ? "pesquisar" : c.dataset.mode);
  input.focus();
}));

/* ---- Estado visual do campo ---- */
function atualizarEstadoInput() {
  form.classList.toggle("has-value", input.value.length > 0);
  if (modo === "historico") desenharHistorico();
}
input.addEventListener("input", atualizarEstadoInput);

/* ---- Envio (Enter ou botão) ---- */
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (ocupado) return;

  const consulta = input.value.trim();
  if (!consulta) {                       // campo vazio: dá um feedback amigável
    statusEl.textContent = "Digite algo para começar.";
    input.focus();
    return;
  }
  if (modo === "historico") return;      // no modo histórico o campo só filtra a lista

  ocupado = true;
  form.classList.add("loading");
  statusEl.textContent = "";
  try {
    salvarHistorico(consulta);
    const mensagem = await processarPesquisa(consulta, modo);
    statusEl.textContent = mensagem || "";
  } catch (erro) {
    console.error(erro);
    statusEl.textContent = "Algo deu errado. Tente novamente.";
  } finally {
    ocupado = false;
    form.classList.remove("loading");
  }
});

/* ---- Atalho: "/" foca a barra (fora de campos de texto) ---- */
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== input && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault(); input.focus();
  }
});

definirModo("pesquisar");
</script>
</body>
</html>
